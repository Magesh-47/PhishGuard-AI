{% extends "layout.html" %}

{% block title %}Login - PhishGuard{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card animate-slide-up">
        <div class="form-header">
            <i class="fas fa-shield-halved"></i>
            <h2>Welcome back</h2>
            <p>Log in to access your scan history and dashboard</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" id="loginForm">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i> Username
                </label>
                <input type="text" class="form-control" id="username" name="username"
                       placeholder="Enter your username" autocomplete="username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Enter your password" autocomplete="current-password" required>
                <button type="button" class="password-toggle" aria-label="Show password"
                        onclick="togglePassword('password', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                <label style="display: flex; align-items: center; gap: 8px; font-weight: 400;">
                    <input type="checkbox" name="remember" style="width: auto;">
                    <span>Remember me</span>
                </label>
                <button type="button" class="link-btn" onclick="showNotification('Password reset isn\'t available yet — contact support for help.', 'info')">Forgot password?</button>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-arrow-right-to-bracket"></i> Log in
            </button>
        </form>

        <div class="form-footer">
            <p>Don't have an account? <a href="{{ url_for('register') }}">Create one</a></p>
        </div>
    </div>
</div>

<script>
function togglePassword(fieldId, btn) {
    const field = document.getElementById(fieldId);
    const icon = btn.querySelector('i');
    const revealing = field.type === 'password';

    field.type = revealing ? 'text' : 'password';
    icon.className = revealing ? 'fas fa-eye-slash' : 'fas fa-eye';
    btn.setAttribute('aria-label', revealing ? 'Hide password' : 'Show password');
}

document.addEventListener('DOMContentLoaded', function() {
    const formGroups = document.querySelectorAll('.form-group');
    formGroups.forEach((group, index) => {
        group.style.animation = `fadeInUp 0.5s ease ${index * 0.1}s both`;
    });
});

document.getElementById('loginForm').addEventListener('submit', function() {
    const btn = this.querySelector('button[type="submit"]');
    if (btn.disabled) return;

    const originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner spin"></i> Logging in...';

    // Self-heals if client-side validation silently blocked the actual
    // submission, so the button can never get stuck disabled.
    setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = originalHtml;
    }, 3000);
});
</script>

<style>
.password-toggle {
    position: absolute;
    right: 15px;
    top: 39px;
    cursor: pointer;
    color: var(--text-faint);
    transition: color 0.2s ease;
    background: none;
    border: none;
    padding: 0;
    font-size: inherit;
    line-height: 1;
}

.password-toggle:hover {
    color: var(--accent);
}

.form-control {
    padding-right: 45px;
}

.link-btn {
    background: none;
    border: none;
    padding: 0;
    color: var(--accent);
    font-family: var(--font-body);
    font-size: 13.5px;
    text-decoration: none;
    cursor: pointer;
}

.link-btn:hover {
    text-decoration: underline;
}
</style>
{% endblock %}
